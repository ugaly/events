<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#g)"/>
  <rect width="800" height="500" fill="url(#grid)" opacity="0.9"/>
  <!-- roads -->
  <path d="M0 250 H800" stroke="#333" stroke-width="18"/>
  <path d="M0 250 H800" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="12 16"/>
  <path d="M320 0 V500" stroke="#333" stroke-width="14"/>
  <path d="M560 0 V500" stroke="#2f2f2f" stroke-width="10"/>
  <path d="M0 140 H800" stroke="#2f2f2f" stroke-width="10"/>
  <path d="M0 370 H800" stroke="#2f2f2f" stroke-width="10"/>
  <path d="M120 0 V500" stroke="#2c2c2c" stroke-width="8"/>
  <path d="M700 0 V500" stroke="#2c2c2c" stroke-width="8"/>
  <!-- blocks -->
  <rect x="40" y="40" width="60" height="80" rx="4" fill="#252525"/>
  <rect x="140" y="50" width="140" height="70" rx="4" fill="#222"/>
  <rect x="360" y="30" width="160" height="90" rx="4" fill="#252525"/>
  <rect x="600" y="40" width="120" height="80" rx="4" fill="#222"/>
  <rect x="40" y="280" width="200" height="70" rx="4" fill="#222"/>
  <rect x="360" y="290" width="120" height="60" rx="4" fill="#252525"/>
  <rect x="600" y="280" width="140" height="80" rx="4" fill="#222"/>
  <rect x="150" y="400" width="180" height="70" rx="4" fill="#252525"/>
  <rect x="500" y="400" width="200" height="60" rx="4" fill="#222"/>
  <!-- venue highlight -->
  <rect x="360" y="200" width="80" height="50" rx="6" fill="#1f1f1f" stroke="#1ed760" stroke-width="2" opacity="0.95"/>
  <text x="400" y="230" text-anchor="middle" fill="#1ed760" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">SUPERDOME</text>
  <!-- soft vignette -->
  <rect width="800" height="500" fill="url(#g)" opacity="0.15"/>
</svg>
